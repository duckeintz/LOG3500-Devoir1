<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG3500 - Devoir 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <!-- Section Formulaire (Gauche) -->
    <section class="form-section">
      <div class="header-text">
        <h1>Ready to start your<br>success story?</h1>
        <p>Signup to our website and start leafing through your favorite literature today!</p>
      </div>

      <form action="#" method="post">
        
        <div class="form-group">
          <label for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Jane Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="janedoe@mail.com" required>
        </div>

        <div class="form-group active-field">
          <label for="interest">Area of interest</label>
          <input type="text" id="interest" name="interest">
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I agree to the <a href="#">Terms &amp; Conditions</a></label>
        </div>

        <button type="submit" class="btn-submit">Sign up</button>
      </form>
    </section>

    <!-- Zone Illustration (Droite) - Utilisation de div pour éviter l'avertissement W3C -->
    <div class="illustration-section">
      <img src="images/illustration.png" alt="Illustration de lecture">
    </div>
  </main>

</body>
</html>
